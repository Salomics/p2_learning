<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gene Lookup</title>

    <link
        href="https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300"
        rel="stylesheet"
        type="text/css"
    >

    {% load static %}

    <link
        rel="stylesheet"
        href="{% static 'hgnc_app/style.css' %}"
    >

</head>

<body>

<div class="container">
    <h1>Gene Lookup</h1>
    <form action="{% url 'search' %}" method="post">
        {% csrf_token %}

        <label for="gene">Enter Gene Symbol or HGNC ID:</label>

        <input
            type="text"
            id="gene"
            name="gene"
            required
        >

        <br><br>

        <button type="submit">
            Get Gene Information
        </button>

    </form>
    
    {% if output_text_1 %}

    <hr>

    <p>{{ output_text_1 }}</p>

    {% if output_text_2 %}
        <p class="the-gene-info">{{ output_text_2 }}</p>
    {% endif %}

{% endif %}

</div>

</body>

</html>
